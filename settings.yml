- keyname: departure_station
  field_type: string
  name: Departure station
  description: Station the train departs from, e.g. Lausanne
  default: Lausanne
  required: true
- keyname: arrival_station
  field_type: string
  name: Arrival station
  description: Station the train arrives at, e.g. Zurich
  default: Zurich
  required: true
- keyname: via_station
  field_type: string
  name: Via station
  description: Optional station to pass through, e.g. Olten
  optional: true
- keyname: min_to_station
  field_type: number
  name: Minutes to reach station
  description: Trains leaving before you can reach the station are not shown
  default: 20
  required: true
